<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AI Based Smart Parking System</title>

<style>
body{
    margin:0;
    font-family:'Segoe UI',sans-serif;
    background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    color:white;
}

header{
    background:#0d1117;
    padding:15px;
    text-align:center;
    font-size:22px;
    letter-spacing:1px;
}

#loginPage{
    display:flex;
    justify-content:center;
    align-items:center;
    height:90vh;
}

.login-box{
    background:#161b22;
    padding:30px;
    border-radius:12px;
    box-shadow:0 0 25px rgba(0,255,255,0.4);
    text-align:center;
}

.login-box input{
    padding:10px;
    margin:10px;
    width:220px;
    background:#0d1117;
    border:1px solid #00ffff;
    color:white;
    border-radius:6px;
}

button{
    padding:10px 18px;
    background:#00ffff;
    color:black;
    border:none;
    cursor:pointer;
    border-radius:6px;
    font-weight:bold;
    margin:5px;
}
button:hover{ background:#00cccc; }

#dashboard{
    display:none;
    padding:20px;
}

.dashboard-info{
    display:flex;
    justify-content:space-around;
    margin-bottom:20px;
    flex-wrap:wrap;
    background:#161b22;
    padding:15px;
    border-radius:10px;
}

.counter{
    font-size:24px;
    font-weight:bold;
}

#parking{
    display:grid;
    grid-template-columns:repeat(5,90px);
    gap:15px;
    justify-content:center;
    margin-top:20px;
}

.slot{
    width:90px;
    height:90px;
    line-height:90px;
    text-align:center;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

.available{background:#00c853;}
.occupied{background:#d50000;}

.gates-wrapper{
    display:flex;
    justify-content:space-evenly;
    gap:15px;
    flex-wrap:wrap;
    align-items: center;
    width: 100%;
}

.gate-container{
    text-align:center;
    margin:30px 0;
}

.gate-base{
    width:40px;
    height:60px;
    background:#444;
    margin:auto;
    border-radius:6px;
    position:relative;
}

.gate-arm{
    width:200px;
    height:10px;
    background:linear-gradient(90deg, red 50%, white 50%);
    background-size:20px 100%;
    position:absolute;
    top:10px;
    left:40px;
    transform-origin:left center;
    transition:transform 0.8s ease-in-out;
}

.gate-light{
    width:15px;
    height:15px;
    border-radius:50%;
    margin:10px auto;
    background:red;
    box-shadow:0 0 10px red;
    transition:0.3s;
}

.open .gate-arm{ transform:rotate(-75deg); }
.open .gate-light{
    background:lime;
    box-shadow:0 0 15px lime;
}

table{
    margin:auto;
    margin-top:20px;
    border-collapse:collapse;
    width:85%;
    background:#161b22;
}

th{
    background:#00ffff;
    color:black;
}

th,td{
    padding:8px;
    border:1px solid #2c5364;
    text-align:center;
}

video{
    border-radius:10px;
    border:2px solid #00ffff;
}
</style>
</head>

<body>

<header>
<h1>Smart Parking System</h1>
</header>

<div id="loginPage">
<div class="login-box">
<h2>Admin Login</h2>
<input type="text" id="username" placeholder="Username"><br>
<input type="password" id="password" placeholder="Password"><br>
<button onclick="login()">Login</button>
<p id="loginError" style="color:red;"></p>
</div>
</div>

<div id="dashboard">

<div class="dashboard-info">
<div>Total: <span class="counter" id="total">10</span></div>
<div>Available: <span class="counter" id="available">10</span></div>
<div>Occupied: <span class="counter" id="occupied">0</span></div>
</div>

<div style="text-align:center;">
<h3>Live Camera</h3>
<video id="video" width="320" height="220" autoplay></video><br>
<button onclick="vehicleEntry()">Vehicle Entry</button>
<button onclick="vehicleExit()">Vehicle Exit</button>
</div>

<!-- Gates in One Line -->
<div class="gates-wrapper">

<div class="gate-container">
<h3>Entry Gate</h3>
<div id="entryGate">
<div class="gate-light"></div>
<div class="gate-base">
<div class="gate-arm"></div>
</div>
</div>
</div>

<div class="gate-container">
<h3>Exit Gate</h3>
<div id="exitGate">
<div class="gate-light"></div>
<div class="gate-base">
<div class="gate-arm"></div>
</div>
</div>
</div>

</div>

<h3 style="text-align:center;">Parking Slots</h3>
<div id="parking"></div>

<h3 style="text-align:center;">Transaction History</h3>
<table>
<thead>
<tr>
<th>Plate</th>
<th>Slot</th>
<th>Entry Time</th>
<th>Exit Time</th>
<th>Fee (₹)</th>
</tr>
</thead>
<tbody id="historyTable"></tbody>
</table>

</div>

<script>

let totalSlots = 10;
let ratePerMinute = 5;
let vehicles = {};

function login(){
let user = document.getElementById("username").value;
let pass = document.getElementById("password").value;
let loginPage = document.getElementById("loginPage");
let dashboard = document.getElementById("dashboard");
let loginError = document.getElementById("loginError");

if(user === "Binary Brain" && pass === "12345"){
    loginPage.style.display = "none";
    dashboard.style.display = "block";
    initCamera();
} else {
    loginError.innerText = "Invalid Credentials";
}
}

function initCamera(){
navigator.mediaDevices.getUserMedia({video:true})
.then(stream=>{
    document.getElementById("video").srcObject = stream;
})
.catch(()=>{
    alert("Camera Permission Denied");
});
}

window.onload = function(){
let parking = document.getElementById("parking");

for(let i=1;i<=totalSlots;i++){
let div=document.createElement("div");
div.className="slot available";
div.innerText="S"+i;
div.dataset.status="available";
parking.appendChild(div);
}
updateDashboard();
};

function updateDashboard(){
let available=0,occupied=0;
document.querySelectorAll(".slot").forEach(s=>{
if(s.dataset.status==="available") available++;
else occupied++;
});
document.getElementById("available").innerText=available;
document.getElementById("occupied").innerText=occupied;
}

function generatePlate(){
return "MP09AB"+Math.floor(1000+Math.random()*9000);
}

function vehicleEntry(){
let plate=generatePlate();
let slots=document.querySelectorAll(".slot");
let found=false;

for(let slot of slots){
if(slot.dataset.status==="available"){
slot.dataset.status="occupied";
slot.className="slot occupied";
vehicles[plate]={slot:slot.innerText,entry:new Date()};
openGate("entryGate");
alert("Vehicle Entered\nPlate: "+plate+"\nSlot: "+slot.innerText);
found=true;
break;
}
}

if(!found){
alert("Parking Full!");
}

updateDashboard();
}

function vehicleExit(){
let plates=Object.keys(vehicles);
if(plates.length===0){
alert("No Vehicles Parked");
return;
}

let slotNumber=prompt("Enter Slot Number (Example: S1)");

if(!slotNumber){
alert("Invalid Slot");
return;
}

let foundPlate=null;

for(let plate in vehicles){
if(vehicles[plate].slot===slotNumber){
foundPlate=plate;
break;
}
}

if(!foundPlate){
alert("No Vehicle Found");
return;
}

let data=vehicles[foundPlate];
let exitTime=new Date();
let minutes=Math.ceil((exitTime-data.entry)/60000);
let fee=minutes*ratePerMinute;

document.querySelectorAll(".slot").forEach(s=>{
if(s.innerText===data.slot){
s.dataset.status="available";
s.className="slot available";
}
});

addHistory(foundPlate,data.slot,data.entry,exitTime,fee);
delete vehicles[foundPlate];

openGate("exitGate");
updateDashboard();

alert("Bill Generated\nPlate: "+foundPlate+
"\nDuration: "+minutes+" min\nFee: ₹"+fee);
}

function addHistory(plate,slot,entry,exit,fee){
let table=document.getElementById("historyTable");
let row=table.insertRow();
row.insertCell(0).innerText=plate;
row.insertCell(1).innerText=slot;
row.insertCell(2).innerText=entry.toLocaleTimeString();
row.insertCell(3).innerText=exit.toLocaleTimeString();
row.insertCell(4).innerText=fee;
}

function openGate(id){
let gate=document.getElementById(id);
gate.classList.add("open");
setTimeout(()=>gate.classList.remove("open"),3000);
}

</script>

</body>
</html>
